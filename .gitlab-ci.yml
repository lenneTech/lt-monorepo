# ======================================================================================================================
# Different stages for pipelines
# See https://docs.gitlab.com/ee/ci/pipelines/
# ======================================================================================================================
stages:
  - test
  - turboops-build
  - deploy

# ======================================================================================================================
# Docker image for runner
# See https://docs.gitlab.com/runner/
# ======================================================================================================================
image: node:22-alpine

# ======================================================================================================================
# Build identity / image coordinates + TurboOps deployment
# IMAGE_TAG = the CI commit SHA — baked into both images (APP_VERSION_COMMIT) so
# App and API can be compared to detect a drifted / stale deployment (see
# docker-compose.yml).
#
# Deployment runs on TurboOps. Requires two CI/CD variables + one repo file:
#   TURBOOPS_PROJECT  the TurboOps project slug (= registry namespace + login user)
#   TURBOOPS_TOKEN    the TurboOps project token (mark it masked)
#   .turboops.json    { "project": "<slug>" } in the repo root
# Run `lt deployment create` to generate the file and print the exact setup steps.
# ======================================================================================================================
variables:
  IMAGE_NAME: registry.turbo-ops.de/${TURBOOPS_PROJECT}
  IMAGE_TAG: ${CI_COMMIT_SHA}
  DOCKER_TLS_CERTDIR: ""

# ======================================================================================================================
# Install npm packages for tasks
# Not processed directly because of the dot (.) at the beginning, but used later in tasks via `extends`
#
# `only` lives HERE, not on the individual jobs, so every test job shares one
# rule. It MUST include `dev` and `main`: those branches build + roll a TurboOps
# stage, and with a merge-request-only rule their `test` stage would be empty —
# a direct push (hotfix, release commit) would deploy completely untested. The
# stage order (test -> turboops-build -> deploy) then gates the deploy on green.
# `interruptible` lets a newer pipeline cancel a superseded one.
# ======================================================================================================================
.distributed:
  interruptible: true
  only:
    - merge_requests
    - dev
    - main
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store/
  before_script:
    # Provision the exact pnpm pinned in package.json (single source of truth).
    # No corepack: Node >= 25 no longer ships it. The +sha512 suffix is stripped;
    # npm enforces registry integrity for the tarball itself.
    - npm install -g "$(node -p "require('./package.json').packageManager.split('+')[0]")"
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile

# ======================================================================================================================
# Fail fast on a broken TurboOps setup, before a job spends minutes building.
# The checks live in scripts/turboops-guard.sh so .gitlab-ci.yml and the GitHub
# deploy workflow share one implementation. See that file for the reasoning.
# ======================================================================================================================
.turboops-guard:
  script:
    - sh scripts/turboops-guard.sh

# ======================================================================================================================
# Lint jobs
# ======================================================================================================================
lint:
  stage: test
  extends: .distributed
  script:
    # Playwright image/package drift — a bumped @playwright/test against a stale CI
    # image reds the whole E2E suite at browser launch. `app:test` lists this job in
    # its `needs:`, so a red lint really does keep the expensive shards from starting
    # (it did NOT before that dependency existed — same stage means parallel, not
    # ordered). See scripts/check-playwright-image.mjs.
    - node scripts/check-playwright-image.mjs
    # Guards the CI file itself: sharding wiring, the audit gate, the artifact
    # contract. All of those fail SILENTLY GREEN when broken (see the script).
    - node scripts/check-ci-consistency.mjs
    - pnpm run format:check
    - pnpm run lint

# Security audit — mirrors the `audit` step of `pnpm run check`, and BLOCKING.
#
# It used to be `allow_failure: true` so an unresolvable advisory would not gate the
# deploy. The problem: that flag suppresses EVERY advisory, including future ones,
# which is the opposite of what an audit gate is for — a genuinely new finding was
# invisible in an MR.
#
# Unresolvable advisories now belong in `auditConfig.ignoreGhsas`
# (pnpm-workspace.yaml), one entry each with its rationale. So a red audit job means
# a NEW advisory that nobody has assessed yet — which is exactly when it should
# block. Resolve findings by pinning the vulnerable transitive dep via `overrides`;
# only add an ignore when the pin provably cannot work.
#
# Scope note: this is a bare `pnpm audit`, so it covers devDependencies too and it
# matches the local `pnpm run check` exactly — a green check therefore means a green
# CI audit, with no threshold gap between them. The cost is that a newly PUBLISHED
# dev-only advisory can red an unrelated hotfix pipeline without any repo change.
# That is the intended trade: assess it and write the entry, rather than narrowing
# the gate to `--prod` and re-introducing a blind spot.
audit:
  stage: test
  extends: .distributed
  script:
    - pnpm audit

# ======================================================================================================================
# Tests jobs
# ======================================================================================================================
api:test:
  stage: test
  extends: .distributed
  # This job has no ceiling of its own otherwise: vitest.config.ts sets no `bail`
  # and no global run limit, and `globalSetup`/`globalTeardown` are NOT covered by
  # `hookTimeout` — so a hung setup runs until the instance-wide job timeout
  # (typically 1 h). ~40 specs at a 30 s timeout is well under 30 min in the worst
  # honest case, which makes anything past it a hang rather than a slow suite.
  timeout: 30 minutes
  services:
    - name: mongo:7
      alias: mongo
  variables:
    # A per-build network with proper DNS aliases for the services, as in app:test.
    # Without it the runner leaves the service on the shared DEFAULT BRIDGE in the
    # deprecated `--link` mode. Two consequences, and the security one is the
    # stronger argument: `mongo:7` runs without authentication, so on the default
    # bridge every other container on that host can read and write this database —
    # and link-based alias resolution is the fragile path whose failure produces
    # `getaddrinfo ENOTFOUND mongo`, each occurrence preceded by MongoDB's 30 s
    # server-selection timeout.
    # (Service CONTAINERS are per job either way — the runner never shares those.
    # What the flag changes is the network they sit on.)
    # Caveat worth knowing when adopting this in a project: the flag is a REQUEST.
    # It only applies on the Docker executor, and a `network_mode` in the runner's
    # config.toml overrides it. scripts/check-ci-consistency.mjs enforces the
    # pairing with a mongo service; it cannot verify the runner honours it.
    FF_NETWORK_PER_BUILD: "true"
    # Side effect of the flag above: services are NOT reachable on 127.0.0.1 any
    # more, they are addressed by their alias. Without this URI the suite falls
    # back to the local default and every beforeAll hook dies on
    # `connect ECONNREFUSED 127.0.0.1:27017` after its timeout.
    # An externally provided URI also opts out of the per-run database naming in
    # projects/api/tests/global-setup.ts — exactly what a throwaway CI service wants.
    NSC__MONGOOSE__URI: "mongodb://mongo:27017/api-ci"
  script:
    # Wait for Mongo before the suite, mirroring app:test. tests/global-setup.ts
    # connects immediately with the driver's 30 s server-selection default, so a
    # slow-starting service would surface as an opaque setup timeout. The runner's
    # own service health check usually covers this — belt and braces, and it keeps
    # the two test jobs symmetrical.
    # NOT `bash -c ... /dev/tcp/...`: /dev/tcp is a bash builtin, and this job runs on
    # the global node:22-alpine image, whose /bin/sh is busybox and which ships no bash.
    # That failed with exit 127 before a single test ran. Node is the one interpreter
    # present in every image this pipeline uses.
    - node scripts/wait-for-tcp.mjs mongo 27017 120
    - pnpm run api:test

# The Playwright suite, split across two containers.
#
# It used to run as ONE job and took a multiple of its local time in CI — right up
# to the hour limit, without ever printing a summary. Three causes, all fixed here:
#
#  1. `nuxt dev` recompiled every route on first hit, once per device project.
#     It now serves the BUILT server from the `build` artifact
#     (`E2E_BUILT_SERVER=true`, see playwright.config.ts).
#  2. The API started via ts-node. It now runs the compiled `dist`.
#  3. Everything ran serially. `parallel:` gives each shard its OWN container
#     with its own API and its own Mongo.
#
# Why TWO shards and not more: Playwright shards at test level, but an
# `outerMostSequentialSuite` (`test.describe.serial`) is atomic and cannot be
# split. `auth-lifecycle.spec.ts` is one 9-step serial chain, which is the floor
# on any split. Measured with `playwright test --list --shard=N/M`:
#   parallel: 2 → 13 / 12     parallel: 4 → 7 / 6 / 11 / 1
# The critical path is the shard holding the serial chain either way, so 4 shards
# buy the runtime of a single `goto('.')` and cost two extra containers (full
# install, artifact download, Mongo, migrations, API boot). Raising this number
# only pays off after that chain is broken into independent groups.
#
# INVARIANT that sharding now depends on: with `fullyParallel: true`, Playwright
# splits at the level of the individual TEST. Only `test.describe.serial` keeps a
# group together. A spec that shares state across a plain `describe` will therefore
# have its steps scattered across shards — and it will not fail loudly, it will hit
# its own `test.skip(!someState, …)` guards and report GREEN. Any new stateful spec
# must use `describe.serial`.
#
# Note this is parallelism across PROCESSES, not workers. `workers: 1` stays in
# playwright.config.ts — it guards against virtual-WebAuthn-authenticator
# conflicts between test files.
app:test:
  stage: test
  # Version-pinned, NOT digest-pinned — deliberately, unlike the production images
  # in the starters' Dockerfiles. A digest here would have to be bumped in lockstep
  # with the tag by hand, and scripts/check-playwright-image.mjs only verifies the
  # VERSION, so a stale digest would drift silently behind a correct-looking tag.
  # An unguarded pin is worse than a guarded tag: the guard is what actually keeps
  # the image and @playwright/test from diverging, which is the failure that breaks
  # the suite now that `playwright install` is gone.
  image: mcr.microsoft.com/playwright:v1.62.1-noble
  timeout: 1 hours
  # NOTE: deliberately NOT `extends: .distributed` for the cache — the rules and
  # before_script are inherited, the cache is overridden below.
  extends: .distributed
  # Same-stage DAG. `build` runs first and its artifact fans out to every shard;
  # `lint` and `audit` are listed so a red one of those keeps the expensive shards
  # from ever starting. Without them, `needs:` would let this job run to completion
  # in parallel with a failing audit and burn the full E2E budget for nothing.
  # Both finish well before `build`, so this costs no wall-clock. All three run on
  # merge requests too, so the dependency resolves in every pipeline.
  needs:
    - job: build
      artifacts: true
    - job: lint
      artifacts: false
    - job: audit
      artifacts: false
  parallel: 2
  # Per-job cache, but still keyed by the lockfile so it invalidates when
  # dependencies change. A constant key (e.g. just the job slug) never expires and
  # the store then grows monotonically, because nothing ever prunes it.
  # `policy: pull` because `build` is a `needs:` predecessor and has already
  # populated the store — the shards only read it, which also removes the
  # last-writer-wins upload race between them.
  cache:
    key:
      files:
        - pnpm-lock.yaml
      prefix: "$CI_JOB_NAME_SLUG"
    paths:
      - .pnpm-store/
    policy: pull
  services:
    - name: mongo:7
      alias: mongo
  variables:
    # A per-build network, so each job gets proper DNS aliases for its services
    # instead of the deprecated `--link` mode. Note the side effect: with this on,
    # services are NOT reachable on `localhost` — which is fine here, because Mongo
    # is addressed as `mongo:27017` and the API runs inside the job container
    # itself, so `localhost:3000` still refers to the API.
    FF_NETWORK_PER_BUILD: "true"
    # API + App run on the classic ports here (no lt dev / Caddy in CI). The App
    # E2E tests read these env vars and fall back to localhost:3000/3001 when
    # unset, so the same suite also runs under `lt dev up` locally.
    # The database name carries $CI_NODE_INDEX: each shard gets its own service
    # container, so this is belt-and-braces — but it is free, and it means a
    # runner that ever hands two shards the same Mongo still cannot let them
    # interfere in shared collections (users, session, BetterAuth jwks).
    NSC__MONGOOSE__URI: "mongodb://mongo:27017/app-ci-$CI_NODE_INDEX"
    MONGO_URI: "mongodb://mongo:27017/app-ci-$CI_NODE_INDEX"
    # The E2E auth helpers refuse to wipe test data unless the database is on
    # loopback (`assertSafeToDelete`, nuxt-base-starter →
    # nuxt-base-template/tests/e2e/helpers/auth-backend.ts; in a generated project:
    # projects/app/tests/e2e/helpers/auth-backend.ts) — a guard against a stray run
    # emptying a real database. Here the host is `mongo`, the per-job SERVICE
    # CONTAINER above, which is thrown away with the job and is exactly the case
    # the guard's opt-out exists for. Without this the guard fires and every spec
    # calling `resetTestData` fails, while the same suite passes locally against
    # 127.0.0.1 — the contradiction is invisible in either repo alone, because the
    # URI is set here and the guard lives in the template.
    #
    # Note it is `FF_NETWORK_PER_BUILD` above that MAKES this necessary: with a
    # per-build network the service is addressable only as `mongo`, so following
    # that rule is what turns the URI non-loopback. The two rules are one decision.
    E2E_ALLOW_REMOTE_DB: "true"
    API_URL: "http://localhost:3000"
    # PLAYWRIGHT=true relaxes rate-limiting and disables the Better-Auth
    # user-cache so freshly-promoted admin users are recognised immediately.
    PLAYWRIGHT: "true"
    # The built Nuxt server instead of `nuxt dev` — see this job's header.
    # Side effect worth knowing: the built server resolves `appEnv` to
    # `production`, so dev-only UI (docs layer, dev widgets) is absent under test.
    # That is better deploy parity, but it IS a behaviour change for any spec that
    # asserted on dev-only chrome.
    E2E_BUILT_SERVER: "true"
    # The Nuxt app needs these too: runtimeConfig ships an empty apiUrl and
    # locally only .env (gitignored) fills it. Without them every page logs
    # "[LtExtensions] No API URL configured" and auth calls resolve against the
    # app origin instead of the API.
    NUXT_API_URL: "http://localhost:3000"
    NUXT_PUBLIC_API_URL: "http://localhost:3000"
    NUXT_PUBLIC_SITE_URL: "http://localhost:3001"
    # The API derives BetterAuth's trustedOrigins and the passkey rpId/origin
    # from appUrl. Without it the app origin is untrusted and every
    # origin-checked endpoint (two-factor/enable, passkey) answers
    # 403 INVALID_ORIGIN.
    APP_URL: "http://localhost:3001"
    # The CI database starts empty, so the SystemSetup middleware redirects every
    # route to /auth/setup and no page under test ever renders. Seeding the first
    # admin on boot turns needsSetup off. Throwaway credentials for a throwaway
    # database — never reuse them anywhere else.
    NSC__SYSTEM_SETUP__INITIAL_ADMIN__EMAIL: "ci-admin@test.com"
    NSC__SYSTEM_SETUP__INITIAL_ADMIN__PASSWORD: "CiThrowawayAdmin123!"
    NSC__SYSTEM_SETUP__INITIAL_ADMIN__NAME: "CI Admin"
    # Where the API's stdout is captured. The email-verification specs read the
    # "[EMAIL VERIFICATION] … token=…" line from this file. Each shard is its own
    # container with its own /tmp, so the path cannot collide across shards.
    NEST_SERVER_LOG: "/tmp/nest-server.log"
  script:
    # Frontend unit tests (vitest) first — fast, need no running stack, fail early.
    # Only in the first shard, otherwise they would run once per shard.
    # `${CI_NODE_INDEX:-1}` on purpose: GitLab only defines that variable for a
    # `parallel:` job, so a bare "$CI_NODE_INDEX" would silently evaluate to
    # `[ "" = "1" ]` → false the day someone drops `parallel:` — and the unit tests
    # would never run again, with a green pipeline. scripts/check-ci-consistency.mjs
    # also guards that pairing.
    - if [ "${CI_NODE_INDEX:-1}" = "1" ]; then (cd projects/app && pnpm run test:unit); fi
    # Wait for Mongo BEFORE starting the API. The compiled API only retries the
    # connection a bounded number of times and then stays down — a slow-starting
    # service would otherwise kill the shard before a single test ran.
    # Same probe as api:test. This job's Playwright image DOES have bash, but keeping
    # one implementation means the next image swap cannot resurrect the exit-127 bug.
    - node scripts/wait-for-tcp.mjs mongo 27017 120
    # Migrations BEFORE the start: `start:e2e:dist` is bare node and does not run
    # them. Without them the demo data is missing and every test built on it skips
    # itself — a suite that quietly skips away reports green and verifies nothing.
    - (cd projects/api && pnpm run migrate:up)
    # The COMPILED API in the background. The subshell keeps the `cd` local.
    # `$!` is captured so the readiness loop can tell "still booting" from "already
    # dead" — without it a crashed API is only noticed when the 120s timeout
    # expires, and it reports as a timeout rather than as the crash it was.
    - (cd projects/api && pnpm run start:e2e:dist > "$NEST_SERVER_LOG" 2>&1) &
    - API_PID=$!
    - |
      timeout 120 sh -c '
        until wget -q --spider http://localhost:3000/meta; do
          kill -0 '"$API_PID"' 2>/dev/null || { echo "API process died during boot:"; tail -n 40 "'"$NEST_SERVER_LOG"'"; exit 1; }
          sleep 2
        done'
    # The base image already ships the browsers for its Playwright version; a
    # `playwright install` would be pure wait time. The blob reporter is what lets
    # the shard reports be merged into ONE readable report afterwards (see
    # app:report) — four disconnected HTML reports were part of the original
    # "never emitted a summary" complaint.
    # Watchdog around the run. If the mongo SERVICE CONTAINER disappears mid-job,
    # every later DB call waits out MongoDB's 30 s server-selection timeout. With
    # Playwright's own `retries: 2` that is ~95 s per test, so a single
    # infrastructure fault burns ~19 min per shard while verifying nothing — and
    # the log reads like failing sign-up tests, with the real cause thousands of
    # lines up. The watchdog polls the service alongside the run and aborts with a
    # message that NAMES it.
    #
    # Note what already caps this and what does not: playwright.config.ts sets
    # `globalTimeout: 40 min`, deliberately below this job's `timeout: 1 hours`,
    # so the ceiling is 40 min per shard rather than the job timeout — and the
    # blob report still gets written. The watchdog's value is therefore mostly
    # DIAGNOSTIC (~36 min of runner time per incident, and far more engineer time):
    # nothing else in the stack can tell "the mongo container died" apart from
    # "the auth tests are broken".
    #
    # The logic lives in scripts/mongo-watchdog.sh rather than inline here because
    # it only ever executes during an infrastructure fault — inline, its first real
    # run would be the day someone is already debugging a red pipeline. As a file
    # it is covered by scripts/mongo-watchdog.test.mjs, which asserts both
    # directions of the contract: a failing run keeps its own exit code (a
    # watchdog that swallowed failures would be worse than none), and a vanished
    # service aborts fast instead of hanging.
    - |
      cd projects/app
      WATCHDOG_API_URL="$API_URL/meta" \
        "$CI_PROJECT_DIR/scripts/mongo-watchdog.sh" mongo 27017 -- \
        pnpm exec playwright test --shard="$CI_NODE_INDEX/$CI_NODE_TOTAL" --reporter=blob
  after_script:
    # The API log no longer streams into the trace — surface its tail on failure.
    # GitLab has no `if: failure()` for after_script: it runs on EVERY outcome, so
    # without the status check this tail lands in green jobs too. That matters
    # downstream more than here — this log carries the
    # "[EMAIL VERIFICATION] … token=…" lines the specs parse (see NEST_SERVER_LOG
    # above), and a project whose API is chattier at boot would print that into
    # every job trace. The GitHub twin already gates on `if: failure()`.
    - if [ "$CI_JOB_STATUS" != "success" ]; then tail -n 60 "$NEST_SERVER_LOG" || true; fi
  artifacts:
    when: always
    paths:
      - projects/app/blob-report
      - projects/app/test-results
    expire_in: 1 week

# Merges the shards' blob reports into a single HTML report. Without this the
# pipeline produces one partial report per shard and no combined view — which is
# most of what "ran to the hour limit without ever printing a summary" meant in
# practice.
app:report:
  stage: test
  image: mcr.microsoft.com/playwright:v1.62.1-noble
  extends: .distributed
  when: always
  needs:
    - job: app:test
      artifacts: true
  script:
    - cd projects/app && pnpm exec playwright merge-reports --reporter=html ./blob-report
  artifacts:
    when: always
    paths:
      - projects/app/playwright-report
    expire_in: 1 week

# ======================================================================================================================
# Build jobs
# ======================================================================================================================
# Builds BOTH projects and hands the results to `app:test`.
#
# Without artifacts every E2E shard would have to re-transpile the API via ts-node
# and let Nuxt compile each page on first hit. That dominated the runtime: the Vite
# cold start was the lion's share, and it would be paid once per shard. Build once,
# use in every shard.
build:
  stage: test
  extends: .distributed
  # glibc, NOT the pipeline default `node:22-alpine`. Nitro bundles PLATFORM-SPECIFIC
  # native binaries into `.output/server/node_modules` (`@img/sharp-*`,
  # `@img/sharp-libvips-*`). Built on musl they resolve to `sharp-linuxmusl-x64`,
  # while the consumer of this artifact — `app:test` on playwright:*-noble — is
  # glibc and looks for `sharp-linux-x64`, which is not in the bundle. Because `ipx`
  # imports sharp lazily, the server still boots and only dies on the first
  # `/_ipx/**` request, with an error that reads like a dependency bug. Any future
  # statically-imported native dep would turn it into a hard boot failure instead.
  image: node:22-bookworm-slim
  script:
    - pnpm run build
    # Assert the artifact contract. `pnpm -r run build` exits 0 when no package
    # matches (the exact trap documented on the turboops-build job below), and
    # GitLab treats an `artifacts:paths` entry that matches no files as a WARNING,
    # not an error. Both together mean a build that produced nothing would go green,
    # and the failure would only surface as all E2E shards timing out against a
    # missing server — pointing at Playwright rather than at this job.
    - test -f projects/api/dist/src/main.js
    - test -f projects/app/.output/server/index.mjs
  artifacts:
    # Kept short: the artifacts are only consumed by `app:test` inside the same
    # pipeline, and are worthless afterwards.
    expire_in: 1 day
    paths:
      - projects/api/dist
      - projects/app/.output

# ======================================================================================================================
# TurboOps build + deploy — build + push the images, then roll the matching stage
# ----------------------------------------------------------------------------------------------------------------------
# Builds both images via docker-compose.yml (passing IMAGE_TAG = the CI commit SHA as
# APP_VERSION_COMMIT so GET /meta, /health-check and /app/admin/system report the exact
# running build), pushes them to the TurboOps registry, then rolls the matching TurboOps
# stage via the TurboOps CLI: `dev` → the `dev` stage, `main` → the `production` stage.
# Create those stages once in TurboOps (matching slugs) + set TURBOOPS_PROJECT /
# TURBOOPS_TOKEN + commit `.turboops.json` (see `lt deployment create`).
#
# Both images read the commit at RUNTIME from a runner-stage ENV — the App maps it onto
# runtimeConfig.public via NUXT_PUBLIC_APP_COMMIT — so no build layer depends on it and
# both stay fully cacheable. An earlier `--no-cache app` here blamed BuildKit for baking
# a stale commit; that was a misdiagnosis. A layer whose ARG is in scope is invalidated
# when the arg changes, so the cache never served a stale SHA. The real cause was that
# `pnpm --filter app` matched no package and exits 0, so `nuxt build` silently never ran
# and the image shipped whatever `.output` the build context happened to carry.
# ======================================================================================================================
turboops-build:
  stage: turboops-build
  image: docker:28-dind
  services:
    - docker:28-dind
  # Download NOTHING from earlier stages. Without this GitLab's default hands this
  # job the `build` artifacts (projects/api/dist + projects/app/.output) and every
  # shard's test-results — straight into the workspace where `docker compose build`
  # runs with `context: .`. That re-arms the exact stale-image failure described in
  # the header above, leaving `.dockerignore` as the only thing between a leftover
  # `.output` and the shipped image. This job builds from source and needs none of it.
  dependencies: []
  before_script:
    - !reference [.turboops-guard, script]
    - docker login -u "$TURBOOPS_PROJECT" -p "$TURBOOPS_TOKEN" registry.turbo-ops.de
  script:
    - docker compose -f docker-compose.yml build api app
    - docker compose -f docker-compose.yml push api app
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "main"'

# dev branch → `dev` stage
# The CLI is pinned to its major: an unpinned `npm install -g` would let a
# breaking 2.x release take down every deployment without a repo change.
deploy-dev:
  stage: deploy
  image: node:22-alpine
  # Nothing from earlier stages — this job reads only docker-compose.yml and
  # .turboops.json out of the repo. See the note on turboops-build.
  dependencies: []
  before_script:
    - !reference [.turboops-guard, script]
    - npm install -g @turboops/cli@^1
    - turbo config set token "$TURBOOPS_TOKEN"
  script:
    # `--compose` forces the compose upload independent of project.detectedConfig;
    # without it a freshly created project can fall into the broken single-service
    # fallback (registry/<slug>-<name> with a dash instead of the pushed
    # registry/<slug>/<name> with a slash) → "not found in registry".
    - turbo deploy dev --compose docker-compose.yml --wait
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'

# main branch → `production` stage
deploy-prod:
  stage: deploy
  image: node:22-alpine
  # Nothing from earlier stages — see the note on turboops-build.
  dependencies: []
  before_script:
    - !reference [.turboops-guard, script]
    - npm install -g @turboops/cli@^1
    - turbo config set token "$TURBOOPS_TOKEN"
  script:
    # `--compose` forces the compose upload independent of project.detectedConfig;
    # without it a freshly created project can fall into the broken single-service
    # fallback (registry/<slug>-<name> with a dash instead of the pushed
    # registry/<slug>/<name> with a slash) → "not found in registry".
    - turbo deploy production --compose docker-compose.yml --wait
  # `rules:` rather than `only:` specifically so production can require a PROTECTED
  # ref, which `only:` cannot express — a branch NAME is not an authorisation.
  # Without it, anyone able to create a branch called `main` in a fork-and-push
  # workflow reaches the production deploy. Protect `main` in the project settings
  # for this to bite; if it is not protected yet, this rule fails closed (no
  # deploy) rather than open, which is the correct direction.
  # `dev` can be tightened the same way once that branch is protected too.
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_COMMIT_REF_PROTECTED == "true"'
