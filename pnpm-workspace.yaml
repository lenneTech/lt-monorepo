shamefullyHoist: true
autoInstallPeers: true
packages:
  - 'projects/*'

# pnpm 11 reads workspace-scoped settings (overrides, build allowlists,
# minimumReleaseAgeExclude, ignoredOptionalDependencies) from THIS file, NOT
# from package.json's `pnpm` block (which pnpm 11 silently ignores). On
# `lt fullstack init` the api + app templates' settings are hoisted into this
# file (see cli/src/lib/hoist-workspace-pnpm-config.ts); the entries below are
# the lt-monorepo's own and are merged with the hoisted ones.

# Build-script approvals. `allowBuilds` is the pnpm 11 key; `onlyBuiltDependencies`
# is kept as the pnpm 10 twin so the allowlist survives whichever key pnpm reads.
allowBuilds:
  '@swc/core': true
  bcrypt: true
  esbuild: true
  puppeteer: true
  sharp: true

# ----------------------------------------------------------------------------------
# Suppressed advisories — each one individually justified.
#
# This list exists so `pnpm audit` — and with it `pnpm run check` and the CI audit
# job — can go GREEN without a blanket escape hatch. The CI job used to carry
# `allow_failure: true`, which suppressed EVERY advisory including future ones; an
# entry here suppresses exactly one, so anything new still turns the job red.
#
# Rules for adding one — all FOUR, or do not add it:
#   1. name the advisory,
#   2. state why it is here: either the dependency provably cannot be fixed, OR the
#      code IS fixed and the advisory is a false positive (an upstream range that
#      was never narrowed). Those are different claims — do not blur them.
#   3. say why the residual risk is acceptable,
#   4. date the verification.
# Exhaust the fix first. An override that raises the dependency to a patched version
# beats an entry here every time; only reach for this list when that provably fails.
#
# TRAVEL: `auditConfig` IS hoisted, since lt CLI 1.42.0 (2026-07-31) added it to the
# whitelist in cli/src/lib/hoist-workspace-pnpm-config.ts next to `overrides` /
# `allowBuilds` / `onlyBuiltDependencies` / `ignoredOptionalDependencies` /
# `minimumReleaseAgeExclude`. A suppression written here therefore reaches the
# generated workspace and applies to EVERY package in it, not only the one that
# justified it — which is exactly why a STALE entry is worse than no entry: it
# silently covers advisories nobody assessed. Drop entries the moment the advisory
# is fixed or its range narrowed. (migration-guides/3.8.0.md and the README still
# describe the pre-1.42.0 "not hoisted" behaviour; they predate the CLI change.)
# ----------------------------------------------------------------------------------
auditConfig:
  # The template itself suppresses nothing: every advisory it has met is currently
  # closed, by an override or by dropping the dependency that pulled it (see
  # `overrides:` below) — the outcome the rules above ask for. Add an entry
  # only when a fix provably cannot work. In a generated workspace the list may hold
  # entries the lt CLI hoisted from projects/api and projects/app; the assessment
  # written above each one in its starter travels with it.
  #
  # Removed 2026-08-22: GHSA-mh99-v99m-4gvg / CVE-2026-14257 (brace-expansion,
  # high). Entered 2026-07-30 as a FALSE POSITIVE, because GitHub's advisory range
  # was then a blanket `<= 5.0.7` that swept up the patched 1.x backports. That
  # range has since been narrowed to per-major windows — the 1.x line now reads
  # `< 1.1.17`, first patched 1.1.17 — so the installed 1.1.18 is no longer
  # reported, and the entry's own documented removal condition ("re-verify when the
  # upstream range is narrowed — then delete this entry") is met verbatim.
  # Verified 2026-08-22 by a fresh resolve with BOTH this block and `overrides:`
  # stripped: `pnpm audit` still reported no known vulnerabilities.
  ignoreGhsas: []

# Dependency overrides (security fixes).
#
# Override TARGETS (right-hand side) MUST be FIXED versions — never ranges like
# ">=X" or "^X" (pnpm would silently install a newer major). The range on the LEFT
# selects which installed versions get replaced, so a bounded key can only ever
# raise a vulnerable version and never cap a patched one.
#
# A pnpm override KEY is matched against the REQUESTED range, not the resolved
# version: a bounded key whose target has fallen behind the newest release in its
# major fires anyway and pins the tree there. It is a pin, not a floor — raise or
# drop it the moment a newer release ships.
#
# NOTE: pnpm `overrides:` apply only to the ROOT project of an install, so these
# do NOT travel to projects generated from this template — they are hoisted into
# the generated workspace by `lt fullstack init` instead.
#
# Empty since 2026-11-02. Its last entries, `brace-expansion@<1.1.21` (2026-09-28)
# and `fast-xml-parser` (removed 2026-08-22), only served commit-and-tag-version,
# which pulled brace-expansion@1 through dotgitignore > minimatch@3 and, with it,
# GHSA-g3hv-75wg-m249 on minimatch@3.1.5. An override cannot close that one:
# dotgitignore calls `minimatch.makeRe()`, which minimatch 11 removed. The release
# tooling is gone (release scripts and .versionrc.json with it), and the
# lockfile holds neither package any more. A generated workspace still gets
# `brace-expansion@<1.1.21` hoisted from nest-server-starter, where a production
# path needs it.
overrides: {}

# Packages allowed past the `minimumReleaseAge` quarantine. pnpm appends here
# automatically when an override targets a release younger than the threshold.
# Empty since 2026-11-02, together with `overrides:` above.
minimumReleaseAgeExclude: []
