# GitHub Actions equivalent of .gitlab-ci.yml — keeps E2E + tests green on
# repos mirrored to GitHub. The App E2E job mirrors the GitLab `app:test`
# job: `build` compiles both projects and publishes them as an artifact, then
# each of two shards boots the compiled API on :3000 (migrations first) and runs
# Playwright, which serves the BUILT Nuxt app on :3001 via its webServer block.
#
# The two pipelines are meant to stay equivalent, and scripts/check-ci-consistency.mjs
# asserts the parts that fail silently green (sharding wiring, the audit gate, the
# artifact contract). When you change one, change the other.
#
# Triggers: pull requests, plus `workflow_call` so deploy.yml can run this
# suite as its gate. There is deliberately NO `push:` trigger — on dev/main
# deploy.yml calls this workflow, so a push trigger would run every test twice.
name: Test

on:
  pull_request:
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Provision the exact pnpm pinned in package.json (single source of truth).
      # No corepack: Node >= 25 no longer ships it. The +sha512 suffix is stripped;
      # npm enforces registry integrity for the tarball itself.
      - run: npm install -g "$(node -p "require('./package.json').packageManager.split('+')[0]")"
      - run: pnpm install --frozen-lockfile
      # Playwright image/package drift, and the CI-file invariants that fail
      # silently green. Same two guards as the GitLab `lint` job.
      - run: node scripts/check-playwright-image.mjs
      - run: node scripts/check-ci-consistency.mjs
      - run: pnpm run format:check
      - run: pnpm run lint

  # Security audit — mirrors the `audit` step of `pnpm run check`, and BLOCKING,
  # exactly like the GitLab `audit` job.
  #
  # It used to be `continue-on-error: true` so an unresolvable advisory would not
  # gate the deploy. The problem: that flag suppresses EVERY advisory, including
  # future ones, which is the opposite of what an audit gate is for — and
  # deploy.yml gates `build-push` on this workflow, so a brand-new critical
  # advisory shipped to production unseen.
  #
  # Unresolvable advisories now belong in `auditConfig.ignoreGhsas`
  # (pnpm-workspace.yaml), one entry each with its rationale. A red audit job
  # therefore means a NEW advisory nobody has assessed yet.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Provision the exact pnpm pinned in package.json (single source of truth).
      # No corepack: Node >= 25 no longer ships it. The +sha512 suffix is stripped;
      # npm enforces registry integrity for the tarball itself.
      - run: npm install -g "$(node -p "require('./package.json').packageManager.split('+')[0]")"
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit

  api-test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    env:
      NSC__MONGOOSE__URI: mongodb://localhost:27017/api-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Provision the exact pnpm pinned in package.json (single source of truth).
      # No corepack: Node >= 25 no longer ships it. The +sha512 suffix is stripped;
      # npm enforces registry integrity for the tarball itself.
      - run: npm install -g "$(node -p "require('./package.json').packageManager.split('+')[0]")"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run api:test

  # Mirrors the GitLab `app:test` job — same two shards, same built server, same
  # compiled API, same migrate-before-boot, same mongo watchdog. Keep the two in
  # lockstep: deploy.yml gates `build-push` on this workflow, so a divergence here
  # means GitHub-hosted projects deploy on a weaker gate than GitLab ones.
  #
  # ONE difference is deliberate and not drift: `FF_NETWORK_PER_BUILD`, which
  # scripts/check-ci-consistency.mjs requires of every GitLab job with a mongo
  # service, has no counterpart here and needs none. That flag moves a GitLab
  # service off the shared default bridge onto a per-build network; GitHub gives
  # every job its own ephemeral runner and its own service containers, torn down
  # with the job, so there is no shared bridge to move off. The guard rule is
  # GitLab-only for that reason — not because nobody got round to it.
  #
  # Two shards and not more: Playwright shards per TEST, but a
  # `test.describe.serial` block is atomic. auth-lifecycle.spec.ts is one 9-step
  # serial chain, so it is the floor on any split — measured 13/12 at two shards
  # vs 7/6/11/1 at four, where the extra containers buy a single `goto('.')`.
  app-test:
    runs-on: ubuntu-latest
    needs: [build]
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    services:
      mongo:
        image: mongo:7
    env:
      # Classic ports in CI (no lt dev / Caddy). The App E2E tests read these
      # env vars and fall back to localhost:3000/3001 when unset, so the same
      # suite also runs under `lt dev up` locally.
      # Per-shard database name: each matrix job gets its own service container,
      # so this is belt-and-braces — but it is free and rules out interference in
      # shared collections (users, session, BetterAuth jwks) entirely.
      NSC__MONGOOSE__URI: mongodb://mongo:27017/app-ci-${{ matrix.shard }}
      MONGO_URI: mongodb://mongo:27017/app-ci-${{ matrix.shard }}
      API_URL: http://localhost:3000
      # Relaxes rate-limiting + disables the Better-Auth user-cache so
      # freshly-promoted admin users are recognised immediately.
      PLAYWRIGHT: 'true'
      # Serve the BUILT Nuxt server from the `build` artifact instead of
      # `nuxt dev`, which recompiled every route on first hit. Note the built
      # server resolves appEnv to `production`, so dev-only UI is absent.
      E2E_BUILT_SERVER: 'true'
      # The Nuxt app needs these too: runtimeConfig ships an empty apiUrl and
      # locally only .env (gitignored) fills it. Without them every page logs
      # "[LtExtensions] No API URL configured" and auth calls resolve against
      # the app origin instead of the API.
      NUXT_API_URL: http://localhost:3000
      NUXT_PUBLIC_API_URL: http://localhost:3000
      NUXT_PUBLIC_SITE_URL: http://localhost:3001
      # The API derives BetterAuth's trustedOrigins and the passkey rpId/origin
      # from appUrl. Without it the app origin is untrusted and every
      # origin-checked endpoint (two-factor/enable, passkey) answers
      # 403 INVALID_ORIGIN.
      APP_URL: http://localhost:3001
      # The CI database starts empty, so the SystemSetup middleware redirects
      # every route to /auth/setup and no page under test ever renders. Seeding
      # the first admin on boot turns needsSetup off. Throwaway credentials for
      # a throwaway database — never reuse them anywhere else.
      NSC__SYSTEM_SETUP__INITIAL_ADMIN__EMAIL: ci-admin@test.com
      NSC__SYSTEM_SETUP__INITIAL_ADMIN__PASSWORD: CiThrowawayAdmin123!
      NSC__SYSTEM_SETUP__INITIAL_ADMIN__NAME: CI Admin
      # Where the API's stdout is captured. The email-verification specs read
      # the "[EMAIL VERIFICATION] … token=…" line from this file.
      NEST_SERVER_LOG: /tmp/nest-server.log
    steps:
      - uses: actions/checkout@v4
      # Provision the exact pnpm pinned in package.json (single source of truth).
      # No corepack: Node >= 25 no longer ships it. The +sha512 suffix is stripped;
      # npm enforces registry integrity for the tarball itself.
      - run: npm install -g "$(node -p "require('./package.json').packageManager.split('+')[0]")"
      - run: pnpm install --frozen-lockfile
      - name: Restore build output
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: projects
      - name: Frontend unit tests (vitest)
        # Only in the first shard, otherwise they would run once per shard.
        if: matrix.shard == 1
        run: cd projects/app && pnpm run test:unit
      - name: Boot API on :3000
        run: |
          # Wait for Mongo BEFORE starting the API — the compiled API only retries
          # the connection a bounded number of times and then stays down.
          node scripts/wait-for-tcp.mjs mongo 27017 120
          # Migrations first: `start:e2e:dist` is bare node and does not run them.
          # Without them the demo data is missing and every test built on it skips
          # itself — a suite that quietly skips away reports green and verifies
          # nothing.
          (cd projects/api && pnpm run migrate:up)
          # The subshell keeps the `cd` local: `cd projects/api && … &` backgrounds
          # the whole compound and leaves this shell in the repo root.
          (cd projects/api && pnpm run start:e2e:dist > "$NEST_SERVER_LOG" 2>&1) &
          API_PID=$!
          timeout 120 sh -c "
            until wget -q --spider http://localhost:3000/meta; do
              kill -0 $API_PID 2>/dev/null || { echo 'API process died during boot:'; tail -n 40 \"$NEST_SERVER_LOG\"; exit 1; }
              sleep 2
            done"
      - name: Run Playwright E2E
        # The base image already ships the browsers for its Playwright version, so
        # there is no `playwright install` here — it would be pure wait time.
        #
        # Wrapped in the same mongo watchdog as the GitLab `app:test` job. If the
        # service container goes away mid-run, every later DB call waits out
        # MongoDB's 30 s server-selection timeout and the shard burns its budget
        # while the log reads like failing sign-up tests. Keeping this in lockstep
        # matters specifically here: deploy.yml gates `build-push` on THIS
        # workflow, so a diagnostic that exists only on the GitLab side would
        # leave GitHub-hosted projects on the weaker gate.
        run: |
          cd projects/app
          WATCHDOG_API_URL="$API_URL/meta" \
            "$GITHUB_WORKSPACE/scripts/mongo-watchdog.sh" mongo 27017 -- \
            pnpm exec playwright test --shard=${{ matrix.shard }}/2 --reporter=blob
      - name: API log (on failure)
        if: failure()
        run: tail -n 60 "$NEST_SERVER_LOG" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blob-report-${{ matrix.shard }}
          path: |
            projects/app/blob-report
            projects/app/test-results
          retention-days: 7

  # Merges the shards' blob reports into ONE readable HTML report. Without this the
  # workflow leaves a partial report per shard and no combined view.
  app-report:
    runs-on: ubuntu-latest
    needs: [app-test]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install -g "$(node -p "require('./package.json').packageManager.split('+')[0]")"
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          pattern: blob-report-*
          merge-multiple: true
          path: projects/app/blob-report
      - run: cd projects/app && pnpm exec playwright merge-reports --reporter=html ./blob-report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: projects/app/playwright-report
          retention-days: 7

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Provision the exact pnpm pinned in package.json (single source of truth).
      # No corepack: Node >= 25 no longer ships it. The +sha512 suffix is stripped;
      # npm enforces registry integrity for the tarball itself.
      - run: npm install -g "$(node -p "require('./package.json').packageManager.split('+')[0]")"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      # Assert the artifact contract. `pnpm -r run build` exits 0 when no package
      # matches, and an upload-artifact path that matches nothing is a warning, not
      # an error. Together that means a build which produced nothing would go green
      # and only surface as every E2E shard timing out against a missing server.
      - run: test -f projects/api/dist/src/main.js
      - run: test -f projects/app/.output/server/index.mjs
      # Handed to app-test so the shards run the compiled API and the built Nuxt
      # server instead of re-transpiling per shard. `runs-on: ubuntu-latest` is
      # glibc, matching the playwright:*-noble container that consumes it — Nitro
      # bundles platform-specific native binaries (@img/sharp-*) into .output, so
      # the producer and consumer must share a libc.
      - uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            projects/api/dist
            projects/app/.output
          retention-days: 1
